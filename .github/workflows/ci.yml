name: CI

# Runs on every push to the default branch and on every pull request, so a
# commit that skipped the pre commit hook is still caught before it merges.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version comes from the packageManager field in package.json, so
      # local and CI never drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # This build proves the code compiles, not that a real environment is
      # configured: CI holds no Supabase keys, so env validation is skipped here
      # and only here. Feature 3 owns the deployed build, which runs with real
      # values and must never set this flag.
      #
      # NEXT_PUBLIC_SITE_URL is the one exception, and it is not a Supabase
      # style secret. Since feature 6, `src/app/layout.tsx` builds its
      # `metadataBase` with `new URL(canonicalSiteUrl)` at module scope, so the
      # value is dereferenced while Next collects page data, not at request
      # time. Skipping validation leaves it `undefined`, and `new URL(undefined)`
      # throws `ERR_INVALID_URL` on `/_not-found` before any page renders. The
      # real production origin is used rather than a placeholder, matching the
      # two test jobs below, so the metadata this build emits is the metadata
      # production emits.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SITE_URL: https://usejobhunt.dev

  # Spec 0004, AC-7 and AC-12. A separate job from `check` on purpose: this one
  # needs Docker and pulls Supabase images, so it is slower, and keeping it apart
  # means a lint or type error still reports in under a minute.
  test:
    name: Test (unit, then integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # AC-12, ENFORCED RATHER THAN ASSERTED: the unit suite runs BEFORE the
      # stack is started, so a unit test that quietly grew a dependency on the
      # database fails here rather than passing forever because the stack
      # happened to be up.
      #
      # The values below are placeholders, and every one of them is a shape that
      # `src/env.ts` accepts and nothing here ever dials. They exist because that
      # module validates the whole contract at import, which is separate from
      # whether anything connects.
      - name: Unit tests, with no stack running
        run: pnpm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_unit_tests_never_connect
          SUPABASE_SECRET_KEY: sb_secret_unit_tests_never_connect
          NEXT_PUBLIC_SITE_URL: https://usejobhunt.dev
          DEV_SESSION_ENABLED: "true"

      # Pinned to the same version as the `supabase` devDependency in
      # package.json and as db-migrate.yml, so nothing applies migrations with a
      # different CLI version than the one used locally.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # Only the containers these tests actually reach: the database, the API
      # gateway, GoTrue for the session mint, and PostgREST for the reads. The
      # rest are excluded because each one is an image to pull and a service to
      # wait for, and none of them is exercised here.
      # Spec 0007, AC-18. `config.toml` enables Google and GitHub with env()
      # substitution, and the file that fills those locally (supabase/.env) is
      # git ignored, so CI has to supply them or GoTrue boots with two providers
      # configured to nothing.
      #
      # Placeholders on purpose: no job here drives a real provider handshake,
      # and the integration suite proves the callback's failure paths, which
      # never reach a provider at all. Confirmed empirically on 2026-08-30
      # against CLI 2.115.0 that the process environment is read, not only the
      # supabase/.env file, which is what makes this block work.
      - name: Start the local Supabase stack
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-google-secret
          SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ci-placeholder-github-client-id
          SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ci-placeholder-github-secret

      # Read back from the stack that is actually running rather than hardcoded.
      # The local keys are fixed development values, not secrets, but reading
      # them means a CLI that ever changes them cannot silently break this job.
      - name: Export the stack's own connection values
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            # Spec 0007. The refusal hook is unreachable from the Data API by
            # design, so its tests call the real function over a direct
            # connection. test/helpers/database.ts refuses any non local host.
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # Against the real stack with the real row level security policies
      # applied, which is the entire point: a mock would be free to agree with a
      # wrong assumption in the code it is meant to be checking.
      - name: Integration tests, against the real stack
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_SITE_URL: https://usejobhunt.dev
          DEV_SESSION_ENABLED: "true"
          # Spec 0007. Its own flag, not DEV_SESSION_ENABLED, because AC-13
          # gives that variable exactly one remaining job. See
          # test/helpers/database.ts.
          TEST_DIRECT_DB_ENABLED: "true"

      # `supabase start` applies migrations and the seed, so a seed that broke
      # would already have failed the step above. This says so out loud, because
      # the fixture pool is what the isolation proof rests on.
      - name: Show what the fixture pool holds
        if: always()
        run: supabase status
